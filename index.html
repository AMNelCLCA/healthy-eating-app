<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Healthy Eating</title>
<meta name="description" content="Plan foods, track your pantry and keep a calm eye on calories.">
<meta name="theme-color" content="#EDE7FF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Eats">

<link rel="icon" type="image/png" href="icon-192.png">

<body>
<main id="view" aria-live="polite"></main>

<nav id="tabbar" aria-label="Main">

  <button data-tab="pantry" aria-label="Pantry"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2zM7 8V5.5A1.5 1.5 0 0 1 8.5 4h7A1.5 1.5 0 0 1 17 5.5V8M9 13h6"/></svg><span>Pantry</span></button>

  <button data-tab="settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span></button>
</nav>

<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="seed-foods.js"></script>
<script src="app.js"></script>

</html>
